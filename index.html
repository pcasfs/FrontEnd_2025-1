<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>lotto</title>
    <link rel="stylesheet" href="./lotto.css" />
  </head>
  <body>
    <div class="frame">
      <div class="wrapper">
        <div class="wrapper-header">
          <div class="wrapper-header-text1"><div>로또 번호 생성기</div></div>
          <div class="wrapper-header-text2">행운의 번호를 생성해보세요!</div>
        </div>
        <div class="wrapper-body">
          <div class="wrapper-create-num">
            <div class="create-num">번호 생성</div>
            <div class="wrapper-ball">
              <div class="ball ball-01">
                <div class="ball-number">?</div>
              </div>
              <div class="ball ball-02">
                <div class="ball-number">?</div>
              </div>
              <div class="ball ball-03">
                <div class="ball-number">?</div>
              </div>
              <div class="ball ball-04">
                <div class="ball-number">?</div>
              </div>
              <div class="ball ball-05">
                <div class="ball-number">?</div>
              </div>
              <div class="ball ball-06">
                <div class="ball-number">?</div>
              </div>
            </div>
            <button onclick="lotto()" class="num-create-btn">
              번호 생성하기
            </button>
          </div>
          <div class="purchase">
            <div class="purchase-lotto">로또 구매하기</div>
            <label for="purchase-ea" class="margin-bottom">구매 수량: </label>
            <input type="number" id="purchase-ea" class="margin-bottom" />
            <div class="total-price margin-bottom">
              총 금액: 0원 (1장당 1,000원)
            </div>
            <button onclick="purchase()" class="purchase-btn margin-bottom">
              구매하기
            </button>
          </div>
          <div class="plus-result-01"></div>
          <div class="plus-result-02"></div>
        </div>
      </div>
    </div>
    <script src="./lotto.js"></script>
  </body>
</html>
